schema_version: 1

context:
  name: libccd-double
  version: "2.1"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/danfis/libccd/archive/v${{ version }}.tar.gz
  sha256: 542b6c47f522d581fbf39e51df32c7d1256ac0c626e7c2b41f1040d4b9d50d1e
  patches:
    - find_libm.patch

build:
  number: 3

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: unix
      then: make
  # Make sure that libccd-double can't be installed
  # together with libccd
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x') }}
  run_constraints:
    - libccd <1

tests:
  - files:
      recipe:
        - test
    requirements:
      run:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ninja
        - cmake
    script:
      - if: unix
        then: test -f $PREFIX/lib/pkgconfig/ccd.pc
      - if: unix
        then: test -f $PREFIX/share/doc/ccd/BSD-LICENSE
      - if: unix
        then: test -f $PREFIX/lib/libccd${SHLIB_EXT}
      - if: unix
        then: test -f $PREFIX/include/ccd/ccd.h
      - if: unix
        then: test -f $PREFIX/include/ccd/ccd_export.h
      - if: unix
        then: test -f $PREFIX/include/ccd/quat.h

about:
  license: BSD-3-Clause
  license_file: BSD-LICENSE
  summary: libccd is library for a collision detection between two convex shapes.
  description: |
    libccd implements variation on Gilbert–Johnson–Keerthi algorithm plus Expand Polytope Algorithm (EPA)
    and also implements algorithm Minkowski Portal Refinement (MPR, a.k.a. XenoCollide) as described in
    Game Programming Gems 7.


  homepage: https://github.com/danfis/libccd

extra:
  recipe-maintainers:
    - wolfv
    - traversaro
